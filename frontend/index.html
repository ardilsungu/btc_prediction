<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BTC Prediction</title>
</head>
<style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #07070f;
      color: #d8d8f0;
      font-family: monospace;
      min-height: 100vh;
      padding: 32px 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 22px;
      letter-spacing: 0.03em;
    }

    #health-status {
      padding: 6px 14px;
      border-radius: 20px;
      background: #0d0d1a;
      border: 1px solid rgba(120,120,200,0.2);
      font-size: 12px;
      color: #5a5a8a;
    }

    #controls {
      display: flex;
      gap: 16px;
      align-items: flex-end;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #5a5a8a;
      margin-bottom: 8px;
    }

    #result {
      background: #111122;
      border: 1px solid rgba(120,120,200,0.15);
      border-radius: 12px;
      padding: 32px;
      color: #5a5a8a;
      font-size: 14px;
    }

    .seg-wrap {
      display: flex;
      gap: 4px;
      background: #0d0d1a;
      border: 1px solid rgba(120,120,200,0.15);
      border-radius: 8px;
      padding: 4px;
    }

    .seg-wrap button {
      padding: 7px 14px;
      border: 1px solid transparent;
      background: transparent;
      color: #5a5a8a;
      font-family: monospace;
      font-size: 12px;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.15s;
    }

    .seg-wrap button:hover {
      color: #d8d8f0;
      background: rgba(255,255,255,0.04);
    }

    .seg-wrap button.active {
      background: #161628;
      color: #d8d8f0;
      border-color: rgba(120,120,200,0.2);
    }

    #predict-btn {
      padding: 0 28px;
      height: 42px;
      border: none;
      background: #5b6af0;
      color: white;
      font-family: monospace;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.15s;
    }

    #predict-btn:hover {
      background: #7880f5;
    }
</style>

<body>

  <header>
    <h1>BTC Predict</h1>
    <div id="health-status">Connecting...</div>
  </header>

  <main>
    <div id="controls">

      <div>
        <label>Model</label>
        <div id="model-group" class="seg-wrap">
          <button data-value="xgboost">XGBoost</button>
          <button data-value="lr">Logistic Reg</button>
        </div>
      </div>

      <div>
        <label>Timeframe</label>
        <div id="timeframe-group" class="seg-wrap">
          <button data-value="15m">15m</button>
          <button data-value="1h">1h</button>
          <button data-value="4h">4h</button>
          <button data-value="1d">1d</button>
        </div>
      </div>

      <button id="predict-btn">Predict</button>

    </div>

    <div id="result">
      <p>Select the model and timeframe, then click Predict.</p>
    </div>
  </main>

<script>
    let selectedModel = 'xgboost';
    let selectedTimeframe = '1h';

    function setActive(group, value) {
      const buttons = document.querySelectorAll(`#${group} button`);
      buttons.forEach(btn => {
        if (btn.dataset.value === value) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    function initControls() {
      document.querySelectorAll('#model-group button').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedModel = btn.dataset.value;
          setActive('model-group', selectedModel);
        });
      });

      document.querySelectorAll('#timeframe-group button').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedTimeframe = btn.dataset.value;
          setActive('timeframe-group', selectedTimeframe);
        });
      });
    }

    async function predict() {
      const btn = document.getElementById('predict-btn');
      btn.textContent = 'Loading...';
      btn.disabled = true;

      try {
        const url = `http://localhost:8000/api/v1/predict?model=${selectedModel}&timeframe=${selectedTimeframe}`;
        const response = await fetch(url);
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || 'Error fetching prediction');
        }
        console.log(data);
        showResult(data);
      } catch (err) {
        document.getElementById('result').innerHTML = `
          <div style="color: #ff4560; font-size: 14px;">
            ● Error: ${err.message}
          </div>
        `;
      } finally {
        btn.textContent = 'Predict';
        btn.disabled = false;
      }
    }

    function showResult(data) {
      const dir = data.prediction;
      const colors = { UP: '#00d48a', DOWN: '#ff4560', NEUTRAL: '#f0a500' };
      const arrows = { UP: '↑', DOWN: '↓', NEUTRAL: '—' };
      const c = data.confidence;

      document.getElementById('result').innerHTML = `
        <div style="display: grid; grid-template-columns: 1fr 300px; gap: 20px;">

          <div>
            <div style="font-size: 52px; font-weight: 800; color: ${colors[dir]}; line-height: 1;">
              ${arrows[dir]} ${dir}
            </div>
            <div style="font-size: 28px; font-weight: 600; margin-top: 8px;">
              $${data.current_price.toLocaleString('en-US', {minimumFractionDigits: 2})}
              <span style="font-size: 14px; color: #5a5a8a;">USDT</span>
            </div>
            <div style="margin-top: 20px; font-size: 12px; color: #5a5a8a;">
              <div>${data.model.toUpperCase()} · ${data.timeframe} · ${data.symbol}</div>
              <div style="margin-top: 4px;">Candle: ${new Date(data.candle_time).toUTCString()}</div>
            </div>
          </div>

          <div>
            <div style="font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: #5a5a8a; margin-bottom: 14px;">Confidence</div>
            ${['UP', 'DOWN', 'NEUTRAL'].map(label => `
              <div style="margin-bottom: 12px;">
                <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px;">
                  <span style="color: ${colors[label]}">${label}</span>
                  <span>${(c[label.toLowerCase()] * 100).toFixed(1)}%</span>
                </div>
                <div style="background: #0d0d1a; border-radius: 3px; height: 4px;">
                  <div style="width: ${c[label.toLowerCase()] * 100}%; height: 100%; background: ${colors[label]}; border-radius: 3px; transition: width 0.6s ease;"></div>
                </div>
              </div>
            `).join('')}
          </div>

        </div>
      `;
    }

    async function checkHealth() {
      try {
        const response = await fetch('http://localhost:8000/health');
        const data = await response.json();
        const total = data.loaded_models.xgboost.length + data.loaded_models.lr.length;
        const el = document.getElementById('health-status');
        if (data.status === 'healthy') {
          el.textContent = `● Healthy · ${total} model`;
          el.style.color = '#00d48a';
        } else {
          el.textContent = `● Degraded · ${total} model`;
          el.style.color = '#f0a500';
        }
      } catch (err) {
        const el = document.getElementById('health-status');
        el.textContent = '● API Closed';
        el.style.color = '#ff4560';
      }
    }

    checkHealth();
    initControls();
    setActive('model-group', selectedModel);
    setActive('timeframe-group', selectedTimeframe);

    document.getElementById('predict-btn').addEventListener('click', predict);
  </script>

</body>
</html>
